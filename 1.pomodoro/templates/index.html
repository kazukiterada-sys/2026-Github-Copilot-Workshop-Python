<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポモドーロタイマー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: #f5f0eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      padding: 48px 64px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      min-width: 320px;
    }

    h1 {
      font-size: 1.5rem;
      color: #c0392b;
      margin-bottom: 8px;
    }

    #session-label {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 32px;
    }

    #timer-display {
      font-size: 5rem;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 4px;
      margin-bottom: 40px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    #btn-start {
      background: #c0392b;
      color: #fff;
    }

    #btn-pause {
      background: #e67e22;
      color: #fff;
    }

    #btn-reset {
      background: #ecf0f1;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍅 ポモドーロタイマー</h1>
    <p id="session-label">作業セッション</p>
    <div id="timer-display">25:00</div>
    <div class="controls">
      <button id="btn-start">▶ スタート</button>
      <button id="btn-pause">⏸ 一時停止</button>
      <button id="btn-reset">↺ リセット</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("timer-display");
    const sessionLabel = document.getElementById("session-label");
    const btnStart = document.getElementById("btn-start");
    const btnPause = document.getElementById("btn-pause");
    const btnReset = document.getElementById("btn-reset");

    const WORK_SECONDS = 25 * 60;
    const BREAK_SECONDS = 5 * 60;

    let remaining = WORK_SECONDS;
    let isRunning = false;
    let isWork = true;
    let interval = null;

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function updateDisplay() {
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      display.textContent = pad(m) + ":" + pad(s);
      sessionLabel.textContent = isWork ? "作業セッション" : "休憩セッション";
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      interval = setInterval(() => {
        if (remaining > 0) {
          remaining--;
          updateDisplay();
        } else {
          clearInterval(interval);
          isRunning = false;
          isWork = !isWork;
          remaining = isWork ? WORK_SECONDS : BREAK_SECONDS;
          updateDisplay();
          alert(isWork ? "休憩終了！ 作業を開始しましょう。" : "作業終了！ 休憩しましょう。");
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(interval);
      isRunning = false;
    }

    function resetTimer() {
      clearInterval(interval);
      isRunning = false;
      isWork = true;
      remaining = WORK_SECONDS;
      updateDisplay();
    }

    btnStart.addEventListener("click", startTimer);
    btnPause.addEventListener("click", pauseTimer);
    btnReset.addEventListener("click", resetTimer);

    updateDisplay();
  </script>
</body>
</html>
