<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
</head>
<body>
    <main>
        <h1>ポモドーロタイマー</h1>
        <div id="timer" aria-live="polite">25:00</div>
        <div>
            <button id="start" type="button">開始</button>
            <button id="stop" type="button">停止</button>
            <button id="reset" type="button">リセット</button>
        </div>
    </main>
</body>
</html>
