{% extends "base.html" %}

{% block title %}ログイン - ポモドーロタイマー{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2 style="text-align: center;">🍅 ログイン</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">ユーザー名</label>
            <input type="text" id="username" name="username" required autofocus placeholder="ユーザー名を入力">
        </div>
        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" required placeholder="パスワードを入力">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">ログイン</button>
    </form>
    <p style="text-align: center; margin-top: 16px; color: #666; font-size: 0.9rem;">
        アカウントをお持ちでない方は <a href="{{ url_for('register') }}" style="color: #c0392b;">新規登録</a>
    </p>
</div>
{% endblock %}
