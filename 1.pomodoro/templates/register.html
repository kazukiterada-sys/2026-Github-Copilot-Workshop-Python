{% extends "base.html" %}

{% block title %}新規登録 - ポモドーロタイマー{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2 style="text-align: center;">🍅 新規登録</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">ユーザー名</label>
            <input type="text" id="username" name="username" required autofocus placeholder="ユーザー名を入力">
        </div>
        <div class="form-group">
            <label for="password">パスワード（4文字以上）</label>
            <input type="password" id="password" name="password" required placeholder="パスワードを入力">
        </div>
        <div class="form-group">
            <label for="confirm_password">パスワード（確認）</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="パスワードをもう一度入力">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">登録する</button>
    </form>
    <p style="text-align: center; margin-top: 16px; color: #666; font-size: 0.9rem;">
        既にアカウントをお持ちの方は <a href="{{ url_for('login') }}" style="color: #c0392b;">ログイン</a>
    </p>
</div>
{% endblock %}
